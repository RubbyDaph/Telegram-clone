name: Build Qt P2P Messenger

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            mingw-w64 \
            wine64 \
            zip \
            p7zip-full \
            python3-pip \
            python3-setuptools
          
          # Обновляем pip и устанавливаем aqtinstall
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall==3.1.11  # Стабильная версия

      - name: Install Qt for Windows
        run: |
          # Установка Qt 6.5.3 для Windows (mingw)
          echo "Installing Qt 6.5.3..."
          python3 -m aqt install-qt windows desktop 6.5.3 win64_mingw --archives qttools qttranslations qtbase qtdeclarative qtnetworkauth qtsvg
          
          echo "Installing CMake tool..."
          python3 -m aqt install-tool windows desktop tools_cmake
          
          echo "Installing OpenSSL..."
          python3 -m aqt install-tool windows desktop tools_openssl
          
          echo "Qt installation completed"
          ls -la $HOME/Qt/

      - name: Configure project
        run: |
          # Пути к установленному Qt
          export QT_DIR="$HOME/Qt/6.5.3/mingw_64"
          export PATH="$QT_DIR/bin:$PATH"
          
          echo "Qt directory: $QT_DIR"
          echo "Checking Qt installation:"
          ls -la "$QT_DIR/bin/" | grep -E "(qmake|windeployqt)"
          
          # Создаем директорию для сборки
          mkdir -p build && cd build
          
          # Конфигурируем проект
          cmake ../source \
            -DCMAKE_PREFIX_PATH="$QT_DIR/lib/cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CROSSCOMPILING=TRUE \
            -GNinja \
            -DCMAKE_INSTALL_PREFIX=./install
          
          echo "CMake configuration completed"

      - name: Build project
        run: |
          export QT_DIR="$HOME/Qt/6.5.3/mingw_64"
          cd build
          
          # Собираем проект
          echo "Building project..."
          cmake --build . --config Release --target install --parallel $(nproc)
          
          # Проверяем результат
          echo "Build output:"
          find . -name "*.exe" -type f | xargs -I {} ls -lh {}

      - name: Collect dependencies
        run: |
          export QT_DIR="$HOME/Qt/6.5.3/mingw_64"
          
          # Находим exe файл
          if [ -f "build/install/bin/TelegramCloneQML.exe" ]; then
            EXE_PATH="build/install/bin/TelegramCloneQML.exe"
            OUTPUT_DIR="build/install/bin"
          elif [ -f "build/TelegramCloneQML.exe" ]; then
            EXE_PATH="build/TelegramCloneQML.exe"
            OUTPUT_DIR="build"
          else
            echo "❌ EXE file not found, searching..."
            find build -name "*.exe" -type f
            exit 1
          fi
          
          echo "Executable found at: $EXE_PATH"
          
          # Создаем папку для релиза
          mkdir -p build/TelegramCloneQML
          
          # Копируем EXE
          cp "$EXE_PATH" build/TelegramCloneQML/
          
          # Копируем необходимые Qt DLL вручную
          echo "Copying Qt DLLs..."
          cp "$QT_DIR/bin/"Qt6Core.dll build/TelegramCloneQML/
          cp "$QT_DIR/bin/"Qt6Quick.dll build/TelegramCloneQML/
          cp "$QT_DIR/bin/"Qt6Qml.dll build/TelegramCloneQML/
          cp "$QT_DIR/bin/"Qt6Network.dll build/TelegramCloneQML/
          cp "$QT_DIR/bin/"Qt6Gui.dll build/TelegramCloneQML/
          
          # Копируем плагины
          mkdir -p build/TelegramCloneQML/{platforms,imageformats}
          cp "$QT_DIR/plugins/platforms/"qwindows.dll build/TelegramCloneQML/platforms/
          cp "$QT_DIR/plugins/imageformats/"qjpeg.dll build/TelegramCloneQML/imageformats/
          
          # Копируем MinGW runtime DLL
          cp /usr/x86_64-w64-mingw32/lib/libstdc++-6.dll build/TelegramCloneQML/
          cp /usr/x86_64-w64-mingw32/lib/libgcc_s_seh-1.dll build/TelegramCloneQML/
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/TelegramCloneQML/
          
          # Копируем QML файлы
          cp -r ../source/*.qml build/TelegramCloneQML/ 2>/dev/null || true
          mkdir -p build/TelegramCloneQML/Pages
          cp -r ../Pages/*.qml build/TelegramCloneQML/Pages/ 2>/dev/null || true
          
          echo "Dependencies collected"

      - name: Test dependencies
        run: |
          cd build/TelegramCloneQML
          
          echo "Checking EXE dependencies with wine..."
          wine64 TelegramCloneQML.exe --version 2>&1 | head -20 || echo "Wine test completed"
          
          echo "Checking DLLs..."
          ls -la *.dll
          echo ""
          echo "Directory structure:"
          find . -type f -name "*.dll" -o -name "*.exe" -o -name "*.qml" | sort

      - name: Create package
        run: |
          cd build
          zip -r TelegramCloneQML-Windows.zip TelegramCloneQML/
          
          echo "📦 Package created:"
          ls -lh TelegramCloneQML-Windows.zip
          echo ""
          echo "📁 Contents:"
          unzip -l TelegramCloneQML-Windows.zip | tail -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCloneQML-Windows
          path: build/TelegramCloneQML-Windows.zip
          retention-days: 7
          if-no-files-found: error