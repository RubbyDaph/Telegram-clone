name: Multiplatform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-quickcontrols2-6-dev \
            libgl1-mesa-dev

      - name: Configure for Linux
        run: |
          mkdir build-linux && cd build-linux
          cmake ../source \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja

      - name: Build for Linux
        run: |
          cd build-linux
          cmake --build . --config Release --parallel $(nproc)

      - name: Test Linux executable
        run: |
          cd build-linux
          if [ -f "TelegramCloneQML" ]; then
            echo "✅ Linux build successful"
            file TelegramCloneQML
            echo "Testing with ldd:"
            ldd TelegramCloneQML 2>/dev/null | head -20 || true
          else
            echo "Executable not found, searching:"
            find . -type f -executable -name "*Telegram*"
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCloneQML-Linux
          path: build-linux/TelegramCloneQML
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    needs: build-linux  # Сначала собираем Linux для проверки

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MXE (M Cross Environment)
        run: |
          # Устанавливаем MXE для кросскомпиляции Windows
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            p7zip-full \
            wget \
            curl \
            unzip \
            python3 \
            libxml2-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libsqlite3-dev
          
          # Клонируем MXE
          git clone https://github.com/mxe/mxe.git
          cd mxe
          
          # Собираем только необходимые компоненты (быстрее)
          make MXE_TARGETS=x86_64-w64-mingw32.shared \
               qtbase \
               qtdeclarative \
               qtquickcontrols2 \
               qttools \
               -j$(nproc)
          
          # Добавляем MXE в PATH
          echo "MXE_DIR=$(pwd)" >> $GITHUB_ENV
          echo "$(pwd)/usr/bin" >> $GITHUB_PATH

      - name: Configure for Windows
        run: |
          mkdir build-windows && cd build-windows
          
          # Toolchain файл для MXE
          cat > toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          
          set(CMAKE_C_COMPILER x86_64-w64-mingw32.shared-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32.shared-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32.shared-windres)
          
          set(CMAKE_FIND_ROOT_PATH ${MXE_DIR}/usr/x86_64-w64-mingw32.shared)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF
          
          # Конфигурируем с MXE toolchain
          cmake ../../source \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${MXE_DIR}/usr/x86_64-w64-mingw32.shared/qt6" \
            -GNinja

      - name: Build for Windows
        run: |
          cd build-windows
          cmake --build . --config Release --parallel $(nproc)

      - name: Collect Windows dependencies
        run: |
          cd build-windows
          
          # Копируем EXE
          mkdir -p package
          if [ -f "TelegramCloneQML.exe" ]; then
            cp TelegramCloneQML.exe package/
          
            # Копируем необходимые DLL из MXE
            cp ${MXE_DIR}/usr/x86_64-w64-mingw32.shared/bin/*.dll package/ 2>/dev/null || true
          
            # Удаляем debug DLL
            cd package
            rm -f *d.dll
          
            # Оставляем только нужные
            for dll in Qt6Core Qt6Gui Qt6Network Qt6Qml Qt6Quick Qt6QuickControls2; do
              if [ -f "${dll}.dll" ]; then
                echo "Keeping ${dll}.dll"
              fi
            done
          
            # Системные библиотеки
            cp ${MXE_DIR}/usr/x86_64-w64-mingw32.shared/bin/lib{gcc_s_seh-1,stdc++-6,winpthread-1}.dll .
          
            # Плагины
            mkdir -p platforms
            cp ${MXE_DIR}/usr/x86_64-w64-mingw32.shared/qt6/plugins/platforms/qwindows.dll platforms/
          
            echo "📁 Package contents:"
            ls -la
          
          else
            echo "❌ EXE not found"
            find . -name "*.exe" -type f
          fi

      - name: Test Windows EXE with Wine
        run: |
          sudo apt-get install -y wine64
          cd build-windows/package
          
          if [ -f "TelegramCloneQML.exe" ]; then
            echo "Testing with Wine:"
            wine64 TelegramCloneQML.exe --version 2>&1 | head -20 || echo "Wine test completed"
          
            # Проверяем зависимости
            echo "Checking DLL ye dependencies:"
            x86_64-w64-mingw32.shared-objdump -p TelegramCloneQML.exe | grep "DLL Name" | sort | uniq
          fi

      - name: Create Windows ZIP
        run: |
          cd build-windows/package
          zip -r TelegramCloneQML-Windows.zip .
          
          echo "📦 Windows package size:"
          ls -lh TelegramCloneQML-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCloneQML-Windows
          path: build-windows/package/TelegramCloneQML-Windows.zip
          if-no-files-found: error

  # Дополнительно: Сборка для Windows на нативном Windows runner
  build-windows-native:
    runs-on: windows-latest
    needs: build-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure with CMake (Windows)
        shell: cmd
        run: |
          mkdir build-windows-native
          cd build-windows-native
          cmake ../source -G "Visual Studio 16 2019" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Windows)
        shell: cmd
        run: |
          cd build-windows-native
          cmake --build . --config Release

      - name: Package Windows native
        shell: cmd
        run: |
          cd build-windows-native/Release
          
          # Используем windeployqt для развертывания
          windeployqt TelegramCloneQML.exe --release --no-translations
          
          echo "Files in Release directory:"
          dir

      - name: Upload Windows Native artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCloneQML-Windows-Native
          path: build-windows-native/Release/
          if-no-files-found: error