name: Simple Qt Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'
        arch: 'win64_mingw'
        setup-python: false
    
    - name: Build
      shell: bash
      run: |
        mkdir build && cd build
        ${{ env.QT_DIR }}/bin/qmake ../source/ CONFIG+=release
        make -j$(nproc)
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: App
        path: build/release/*.exe
