name: Build Windows EXE with MXE

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            p7zip-full \
            wget \
            curl \
            unzip \
            python3 \
            python3-pip \
            ninja-build

      - name: Download prebuilt MXE with Qt
        run: |
          # Скачиваем предсобранный MXE с Qt
          wget https://github.com/mxe/mxe/releases/download/qt6-2024/mxe-qt6-ubuntu-22.04.tar.xz
          tar -xf mxe-qt6-ubuntu-22.04.tar.xz
          export PATH=$(pwd)/mxe/usr/bin:$PATH
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          # Проверяем доступность компиляторов
          x86_64-w64-mingw32.shared-gcc --version
          x86_64-w64-mingw32.shared-qmake-qt6 --version

      - name: Create simple .pro file for qmake
        run: |
          # Создаем простой .pro файл для сборки
          cat > source/TelegramCloneQML.pro << 'EOF'
          QT += core quick qml network gui
          
          TARGET = TelegramCloneQML
          TEMPLATE = app
          CONFIG += c++17
          
          SOURCES += \
              main.cpp \
              ChatList.cpp \
              DialogClass.cpp \
              MessageClass.cpp \
              NetworkManager.cpp \
              UserController.cpp
          
          HEADERS += \
              ChatList.h \
              DialogClass.h \
              MessageClass.h \
              NetworkManager.h \
              UserController.h
          
          RESOURCES += sources.qrc
          
          QML_FILES = \
              Main.qml \
              ChatsDelegate.qml \
              DialogDelegate.qml \
              Pages/AddUser.qml
          
          # Для Windows
          win32 {
              RC_FILE = app.rc
              TARGET = $$join(TARGET,,,.exe)
          }
          
          # Пути для QML
          QML_IMPORT_PATH = $$PWD
          EOF
          
          # Создаем простой файл ресурсов, если его нет
          if [ ! -f "source/sources.qrc" ]; then
            cat > source/sources.qrc << 'EOF'
            <RCC>
              <qresource prefix="/">
                <file>Main.qml</file>
                <file>ChatsDelegate.qml</file>
                <file>DialogDelegate.qml</file>
                <file>Pages/AddUser.qml</file>
              </qresource>
            </RCC>
            EOF
          fi

      - name: Build with qmake
        run: |
          export PATH=$(pwd)/mxe/usr/bin:$PATH
          cd source
          
          # Используем qmake из MXE
          x86_64-w64-mingw32.shared-qmake-qt6 TelegramCloneQML.pro
          
          # Компилируем
          make -j$(nproc) release
          
          # Проверяем результат
          ls -la release/*.exe || ls -la *.exe

      - name: Collect DLL dependencies
        run: |
          export PATH=$(pwd)/mxe/usr/bin:$PATH
          cd source
          
          # Ищем exe файл
          if [ -f "release/TelegramCloneQML.exe" ]; then
            EXE_PATH="release/TelegramCloneQML.exe"
          elif [ -f "TelegramCloneQML.exe" ]; then
            EXE_PATH="TelegramCloneQML.exe"
          else
            echo "❌ EXE not found, searching..."
            find . -name "*.exe" -type f
            exit 1
          fi
          
          echo "✅ Found: $EXE_PATH"
          
          # Создаем папку для дистрибутива
          mkdir -p dist
          cp "$EXE_PATH" dist/
          
          # Копируем необходимые DLL из MXE
          cp mxe/usr/x86_64-w64-mingw32.shared/bin/*.dll dist/ 2>/dev/null || true
          
          # Фильтруем только нужные Qt DLL
          cd dist
          rm -f *d.dll  # Удаляем debug версии
          ls -la *.dll

      - name: Create minimal package
        run: |
          mkdir -p package/TelegramCloneQML
          
          # Копируем exe
          cp source/dist/TelegramCloneQML.exe package/TelegramCloneQML/
          
          # Копируем только необходимые DLL
          cd package/TelegramCloneQML
          
          # Основные системные DLL
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/libgcc_s_seh-1.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/libstdc++-6.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/libwinpthread-1.dll .
          
          # Qt DLL
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/Qt6Core.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/Qt6Gui.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/Qt6Network.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/Qt6Qml.dll .
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/Qt6Quick.dll .
          
          # Плагины Qt
          mkdir -p platforms
          cp ../../mxe/usr/x86_64-w64-mingw32.shared/bin/qt6/plugins/platforms/qwindows.dll platforms/
          
          # QML файлы
          mkdir -p qml
          cp ../../source/*.qml qml/ 2>/dev/null || true
          mkdir -p Pages
          cp ../../Pages/AddUser.qml Pages/ 2>/dev/null || true
          
          # Создаем batch файл для запуска
          cat > run.bat << 'EOF'
          @echo off
          echo Starting TelegramCloneQML...
          TelegramCloneQML.exe
          pause
          EOF
          
          echo "📁 Package contents:"
          find . -type f | sort

      - name: Create ZIP archive
        run: |
          cd package
          zip -r TelegramCloneQML-Windows.zip TelegramCloneQML/
          
          echo "📦 Package size:"
          ls -lh TelegramCloneQML-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCloneQML-Windows
          path: package/TelegramCloneQML-Windows.zip
          retention-days: 7