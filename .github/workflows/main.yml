name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake mingw-w64 zip
    
    - name: Build simple EXE
      run: |
        cat > main.cpp << 'EOF'
        #include <iostream>
        int main() {
            std::cout << "Hello from Windows EXE!" << std::endl;
            return 0;
        }
        EOF
        
        x86_64-w64-mingw32-g++ main.cpp -o MyApp.exe -static -mwindows
        
        if [ -f "MyApp.exe" ]; then
          echo "✅ EXE created successfully"
          ls -lh MyApp.exe
        else
          echo "❌ Failed to create EXE"
          exit 1
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: MyApp.exe
        retention-days: 7
